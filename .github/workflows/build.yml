name: Compilar y probar

on:
  push:
    branches: [master, mejora-10-de-10]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore "Systema.De Gestion.Academica.sln"

      - name: Compilar
        run: dotnet build "Systema.De Gestion.Academica.sln" --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test "Systema.De Gestion.Academica.Tests/Systema.De Gestion.Academica.Tests.csproj" --configuration Release --no-build
